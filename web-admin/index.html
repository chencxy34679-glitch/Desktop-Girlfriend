<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desktop Girlfriend — 后台管理</title>
    <meta name="description" content="Desktop Girlfriend 项目方运营后台" />

    <!-- 像素风字体: Press Start 2P + Inter + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&subset=latin&display=swap"
    />

    <!-- pxlkit dark-mode 同步脚本(避免首屏闪烁) -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('pxlkit:dark-mode');
          var mode = saved || 'system';
          var resolved =
            mode === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : mode;
          document.documentElement.classList.add(resolved);
        } catch (e) {
          /* 默认 light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
