# ============================================
# 开发环境配置(本机 MySQL 版)
# ============================================
# 用法:
#   复制 .env.example 为 .env,填好本机实际值,然后:
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev
#
# .env 不入仓(.gitignore 已忽略)。所有凭证一律走环境变量,本文件只保留占位默认值。
#
# 依赖现状:
#   MySQL    —— 必需,启动即连接
#   Postgres —— M2 启用(RAG 向量库),当前 health 报 not_configured
#   Redis    —— M2 启用(限流/计数),当前 health 报连接失败但不影响启动

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:desktop_gf_dev}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # ---- Redis:M2 计费阶段启用,当前不配置也能启动 ----
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 2000ms
      connect-timeout: 2000ms
      lettuce:
        shutdown-timeout: 100ms

  # ---- Spring AI:M2 接入 DeepSeek 时填真实 Key ----
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:sk-placeholder-not-used-in-dev}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-chat}
          temperature: 0.7

  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null

server:
  port: 8080

# 项目方 API Key(M2+ 才会用到,当前留空)
aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}

desktop-girlfriend:
  version: 0.1.0
  jwt:
    # 生产必须通过 JWT_SECRET 环境变量注入;此处默认值仅供本地开发
    secret: ${JWT_SECRET:desktop-girlfriend-dev-only-secret-change-in-production-2026}
    access-token-ttl: 3600
    refresh-token-ttl: 2592000
  billing:
    free-chat-daily: 30
    free-agent-daily: 3
  oss:
    bucket-public: ${OSS_BUCKET_PUBLIC:desktop-girlfriend-public}
    bucket-update: ${OSS_BUCKET_UPDATE:desktop-girlfriend-update}
  update:
    channels: stable,beta,internal
    default-channel: stable

logging:
  level:
    root: INFO
    com.cxy.desktopgf: DEBUG
    org.flywaydb: INFO
    # 调试期把 Mapper 执行的 SQL 与参数打到日志,便于定位 500
    com.cxy.desktopgf.module.auth.mapper: DEBUG
  file:
    # 落盘一份,避免 maven stdout 被截断时丢日志
    name: ${LOG_FILE:target/server-dev.log}
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
