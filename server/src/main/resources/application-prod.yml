# 生产环境配置
# 用法: SPRING_PROFILES_ACTIVE=prod java -jar app.jar
# 所有敏感配置走环境变量注入,不在仓库中保留明文。

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DB}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 30000

  datasource-pg:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DB:0}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 50
          max-idle: 10
          min-idle: 2

  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: ${DEEPSEEK_BASE_URL}
      chat:
        options:
          model: ${DEEPSEEK_MODEL}
          temperature: 0.7
      embedding:
        options:
          model: ${EMBEDDING_MODEL}

aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT}
    access-key-id: ${OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}

wechat:
  pay:
    app-id: ${WECHAT_APPID}
    mch-id: ${WECHAT_MCH_ID}
    mch-serial-no: ${WECHAT_MCH_SERIAL}
    private-key-path: ${WECHAT_PRIVATE_KEY_PATH}
    api-v3-key: ${WECHAT_API_V3_KEY}

alipay:
  app-id: ${ALIPAY_APP_ID}
  private-key: ${ALIPAY_PRIVATE_KEY}
  public-key: ${ALIPAY_PUBLIC_KEY}
  gateway: https://openapi.alipay.com/gateway.do

amap:
  api-key: ${AMAP_API_KEY}

logging:
  level:
    root: WARN
    com.cxy.desktopgf: INFO
  file:
    name: /var/log/desktop-girlfriend/app.log