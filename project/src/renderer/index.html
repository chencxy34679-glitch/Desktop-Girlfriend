<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- connect-src 里的 data: 是 PixiJS v8 需要的：
         它内部会 fetch 一张 base64 的 1x1 占位纹理 -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' data: ws: http://localhost:* blob:; worker-src 'self' blob:; child-src 'self' blob:;" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>桌面宠物</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        /* 桌面宠物不需要文本选中 / 右键系统菜单 / 拖拽默认行为 */
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
      }
      body {
        /* 让整个窗口都可接收鼠标，但内部就靠 PixiJS stage 处理事件 */
        cursor: grab;
      }
      body.dragging { cursor: grabbing; }
      #pet-stage {
        width: 100vw;
        height: 100vh;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="pet-stage"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
